# 锚点
pr: &pr {type: select, proxies: [🐸 手动切换, 🤖 ChatGPT, 🏦 国内银行APP, 🦄 亚马逊, 🛡️ 隐私防护, 🎵 TikTok, 📹 YouTube, 🍃 Netflix, 🎞️ 国内媒体, 🌍 国外媒体, 🦅 美国节点, 🏳️‍🌈 美国均衡, 🤯 低价均衡, 🟢 全球直连]}

# 机场订阅，名称不能重复
proxy-providers:
  Acyun: #机场名字
    type: http
    interval: 1800 #机场更新时间（单位：s）
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🟢 全球直连
    url: "XXXXXXX"
      
# 用于下载订阅时指定UA
global-ua: clash.meta
    
# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: false                 
allow-lan: true            
unified-delay: true       
tcp-concurrent: true        
authentication:            
  - name:passwd           
geodata-mode: false       
geodata-loader: standard
geo-auto-update: true      
geo-update-interval: 48    
geox-url:
  geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.metadb"
  geoip: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  asn: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
  
external-controller: 0.0.0.0:9090
secret: "1843187043jia"
external-ui: ui
external-ui-url: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# 下载面板地址可更换：https://mirror.ghproxy.com/https://github.com/MetaCubeX/Yacd-meta/archive/gh-pages.zip（备用）

find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true
  
# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    
# 代理模式
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true 
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  # 模式切换 whitelist；白名单/blacklist；黑名单   
  # 黑名单模式表示如果匹配成功则不返回 Fake-IP, 白名单模式时只有匹配成功才返回 Fake-IP
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - geosite:private
    - geosite:cn
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
    - 223.5.5.5
    - 119.29.29.29
    "rule-set:geolocation-!cn":
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"
 
   
proxies:
- name: "🟢 全球直连"
  type: direct
  udp: true

  
# 策略组
proxy-groups:
  - {name: 🐸 手动切换, type: select, include-all: true, tolerance: 20, interval: 300}
  - {name: 🤖 ChatGPT, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 📹 YouTube, type: select, proxies: [🦅 美国节点, 🐸 手动切换]}
  - {name: 🎵 TikTok, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 📲 Telegram, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 🚂 Google, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 🦅 美国节点, type: select, include-all: true, filter: "(?=.*(美国))^((?!(优化|亿分)).)*$"}
  - {name: 🎥 Netflix, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(香港|美国Ⅰ|德国Ⅰ|英国Ⅰ|日本|新加坡))"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(德国Hy2 ×1|英国Hy2 ×0|优化|美国 ①|距离下次)).)*$"}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🦅 美国节点, 🐸 手动切换, ♻️ 自动选择]}
  - {name: 🎞️ 国内媒体, type: select, proxies: [🟢 全球直连, 🐸 手动切换, 🦅 美国节点]}
  - {name: 🌍 国外媒体, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 🐬 OneDrive, type: select, proxies: [🐸 手动切换, 🦅 美国节点]}
  - {name: 💶 PayPal, type: select, proxies: [🦅 美国节点, 🐸 手动切换]}
  - {name: 🍎 Apple, type: select, proxies: [🟢 全球直连, 🐸 手动切换, 🦅 美国节点]}
  - {name: 🪟 Microsoft, type: select, proxies: [🟢 全球直连, 🐸 手动切换]}
  - {name: 🦄 亚马逊, type: select, proxies: [🟢 全球直连, 🐸 手动切换, 🦅 美国节点]}
  - {name: 🏦 国内银行APP, type: select, proxies: [🟢 全球直连, 🐸 手动切换, 🦅 美国节点]}

#释义：
#      #fallback/故障转移、select/手动、url-test/自动、include-all/全部节点
#(
#  包含
#  : (?=.*(XXX|XXX|XXX))
#  不包含
#  : ^((?!(XXX|XXX|XXX)).)*$
#  手动
#  : select
#  自动
#  : fallback

#  ip：
#  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
#  域名：
#  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
#    名称   规则名    远端规则    更新频率/秒     二进制内容 规则名       mrs后缀名文件


#  qcy: &qcy {type: http, interval: 86400, behavior: domain, format: text}

#  class: &class {type: http, interval: 86400, behavior: classical, format: text}
#   名称   规则名    远端规则    更新频率/秒     二进制内容 规则名       list后缀名文件（经典后缀格式）
# )
rules:     #分流规则，按顺序依次排列
  #纯域名
  - RULE-SET,private_domain,🟢 全球直连  #互联网收集
  - RULE-SET,direct1,🟢 全球直连  #私有收集
  - RULE-SET,amazon_domain,🦄 亚马逊  #私有收集
  - RULE-SET,amazon1_domain,🦄 亚马逊  #私有收集
  - RULE-SET,cmb_domain,🏦 国内银行APP  #私有收集
  - RULE-SET,icbc_domain,🏦 国内银行APP  #私有收集
  - RULE-SET,ccb_domain,🏦 国内银行APP  #私有收集
  - RULE-SET,abc_domain,🏦 国内银行APP  #私有收集
  - RULE-SET,ChatGPT,🤖 ChatGPT  #私有收集
  - RULE-SET,youtube_domain,📹 YouTube  #互联网收集
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,google_domain,🚂 Google
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,microsoft_domain,🐬 OneDrive
  - RULE-SET,cn_domain,🟢 全球直连
  - RULE-SET,netflix_domain,🎥 Netflix
  #纯IP
  - RULE-SET,google_ip,🚂 Google,no-resolve
  - RULE-SET,netflix_ip,🎥 Netflix,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,cn_ip,🟢 全球直连
  - MATCH,🐟 漏网之鱼

