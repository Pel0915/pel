proxy-providers:
  HXY: #机场名字
    type: http
    interval: 43200
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🟢 直连
    url: "XXX"

  Acyun: #机场名字
    type: http
    interval: 43200
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🟢 直连
    url: "XXX"

global-ua: clash.meta
    
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
authentication:
  - XXX:XXX             #用户名：密码
  
geodata-mode: true
geodata-loader: standard
geo-auto-update: true 
geo-update-interval: 48
geox-url:
  geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.metadb"
  geoip: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  asn: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
external-controller: 0.0.0.0:9090
secret: "sjhJHF"
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# 下载面板地址可更换：https://github.com/MetaCubeX/Yacd-meta/archive/gh-pages.zip（备用）
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true
  
# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    
# 代理模式
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  # 模式切换 whitelist；白名单/blacklist；黑名单   
  # 黑名单模式表示如果匹配成功则不返回 Fake-IP, 白名单模式时只有匹配成功才返回 Fake-IP
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - geosite:private
    - geosite:cn
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
    - 223.5.5.5
    - 119.29.29.29
    "rule-set:geolocation-!cn":
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"


proxies:
- name: "🟢 直连"
  type: direct
  udp: true

# 锚点
pr: &pr {type: select, proxies: [🐸 手动切换, 🤖 AI, 🎵 TikTok, 📹 YouTube, 🎥 Netflix， 🌍 国际, 🦅 美国-自动, 🟢 直连]}
  
# 策略组
proxy-groups:
  - {name: 🐸 手动切换, type: select, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*())^((?!(官网|刷新|重新|节点|三网优化|优化|①|冷门)).)*$"}
  - {name: 🤖 AI, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 📹 YouTube, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 🎵 TikTok, type: select, proxies: [🦅 美国-自动, 🐸 手动切换, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 📲 Telegram, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 📀 流媒体, type: select, proxies: [🦅 美国-自动, 🐸 手动切换, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 🦄 亚马逊, type: select, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美国|德国|英国|法国|JP|日本|加拿大|墨西哥|巴西|澳大利亚))^((?!(IPV6|官网|刷新|重新|节点|三网优化|优化|①|冷门|德国Hy2 ×1|英国Hy2 ×0|优化|美国 ①|距离下次)).)*$"}
  - {name: 🌍 国际, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, ♻️ 所有-自动]}
  - {name: 🐬 OneDrive, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 🚂 Google, type: select, proxies: [🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}
  - {name: 💶 PayPal, type: select, proxies: [🦅 美国-自动, 🐸 手动切换]}
