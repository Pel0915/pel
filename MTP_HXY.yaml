  - {name: 🟢 全球直连, type: select, proxies: [🟢 直连, 🐸 手动切换, 🦅 美国-自动, 🦄 亚马逊, 港台日新韩-自动, 台日新韩-自动, 热门节点-自动,♻️ 所有-自动]}

#节点组
