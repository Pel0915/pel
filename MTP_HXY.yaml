  - {name: 🦅 美国-自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美国))^((?!(IPV6|官网|刷新|重新|节点|三网优化|优化|①|冷门)).)*$"}
  - {name: 港台日新韩-自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(香港|🇭🇰|台湾|🇨🇳|新加坡|🇸🇬|韩国|🇰🇷))"}
