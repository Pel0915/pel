proxy-providers:
  HXY: #机场名字
    type: http
    interval: 43200 #机场更新时间（单位：s）
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1800
    proxy: 🟢 直连
    url: ""

  Acyun: #机场名字
    type: http
    interval: 43200 #机场更新时间（单位：s）
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1800
    proxy: 🟢 直连
    url: ""

# 用于下载订阅时指定UA
global-ua: clash.meta

# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: true
allow-lan: true             #允许局域网流量
unified-delay: true         #统一延迟
tcp-concurrent: true        #默认开启
# interface-name: eth0  （路由器下根据情况指定出站接口）
authentication:
  
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 84
geox-url:
  geoip: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://mirror.ghproxy.com/https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# 控制面板
external-controller: 0.0.0.0:9095
secret: "1843187043jia"
external-ui: ui
#external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip" #（备用）

find-process-mode: off
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

 # 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true
 # 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
 # 代理模式
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:            # 关闭dns劫持需注释
    - "any:53"           # 关闭dns劫持需注释
    - "tcp://any:53"     # 关闭dns劫持需注释
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
 # DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "rule-set:cn_domain"
    - "rule-set:private_domain"
    - "+.apple.com"
    - "+.xn--ngstr-lra8j.com"
    - "+.services.googleapis.cn"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    "rule-set:geolocation-!cn":
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"


proxies:
- name: "🟢 直连"
  type: direct
  udp: true

pr: &pr {type: select, proxies: [🟢 直连]}
# 策略组
proxy-groups:
  - {name: 🐸 手动切换, type: select, include-all: true, tolerance: 20, interval: 600, filter: "(?=.*())^((?!(官网|刷新|重新|节点|三网优化|优化|①|冷门|德国Hy2 ×1|英国Hy2 ×0|优化|美国 ①|距离下次)).)*$"}
  - {name: 🤖 AI, type: select, include-all: true, tolerance: 20, interval: 600, filter: "(?=.*())^((?!(官网|刷新|重新|节点|三网优化|优化|①|冷门|德国Hy2 ×1|英国Hy2 ×0|优化|美国 ①|距离下次)).)*$"}
  - {name: 🌍 国际, type: select, include-all: true, tolerance: 20, interval: 600, filter: "(?=.*())^((?!(官网|刷新|重新|节点|三网优化|优化|①|冷门|德国Hy2 ×1|英国Hy2 ×0|优化|美国 ①|距离下次)).)*$"}
  - {name: 📀 流媒体, type: url-test, include-all: true, tolerance: 20, interval: 600, filter: "(?=.*(香港|台湾|新加坡|马来西亚|日本|美国|US|HK|TW|SG|MY|JP))^((?!(免流|IPV6|官网|刷新|重新|节点|三网优化|优化|①|冷门|德国Hy2 ×1|英国Hy2 ×0|优化|美国 ①|距离下次)).)*$"}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🌍 国际, 🟢 直连]}
rules:
  - RULE-SET,direct_domain,🟢 直连
  - RULE-SET,cn_ip,🟢 直连,no-resolve
  - RULE-SET,private_ip,🟢 直连,no-resolve
  - RULE-SET,hbo_domain,📀 流媒体
  - RULE-SET,disney_domain,📀 流媒体
  - RULE-SET,spotify_domain,📀 流媒体
  - RULE-SET,netflix_domain,📀 流媒体
  - RULE-SET,AI_domain,🤖 AI
  - RULE-SET,telegram_domain,🌍 国际
  - RULE-SET,discord_domain,🌍 国际
  - RULE-SET,github_domain,🌍 国际
  - RULE-SET,google_domain,🌍 国际
  - RULE-SET,netflix_ip,📀 流媒体,no-resolve
  - RULE-SET,AI_ip,🤖 AI,no-resolve
  - RULE-SET,telegram_ip,🌍 国际,no-resolve
  - RULE-SET,google_ip,🌍 国际,no-resolve
  - MATCH,🐟 漏网之鱼

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  Pel: &Pel {type: http, interval: 86400, behavior: domain, format: text}
  clash: &clash {type: http, interval: 86400, behavior: classical, format: text}

rule-providers:
  netflix_domain:
    !!merge <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/netflix.mrs"  # 📀 流媒体
